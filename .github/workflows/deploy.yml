name: Deploy DNS Secure Application

on:
  workflow_dispatch:
  pull_request:
    branches:
      - initial-setup
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest
    
    steps:
      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          path: orchestrator

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: RegevNir/dns-secure-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: RegevNir/dns-secure-frontend
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pypoetry\Cache
            backend\.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend\node_modules
            ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Poetry
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:APPDATA\Python\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Configure Poetry
        working-directory: backend
        run: poetry config virtualenvs.in-project true
        shell: pwsh

      - name: Verify Poetry installation
        run: poetry --version
        shell: pwsh

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if (Test-Path ".venv") {
            Write-Host "Virtual environment found, checking if dependencies are up to date..."
            poetry install --no-interaction --no-ansi
          } else {
            Write-Host "No virtual environment found, installing dependencies from scratch..."
            poetry install --no-interaction --no-ansi
          }
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        shell: pwsh

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        shell: pwsh

      - name: Backend - start server and run API checks
        run: |
          $backend = Start-Process pwsh `
            -WorkingDirectory "$PWD\backend" `
            -ArgumentList '-NoLogo','-NoProfile','-Command','poetry run python -m uvicorn app.main:app --host 127.0.0.1 --port 8000' `
            -PassThru -WindowStyle Hidden
          
          try {
            Write-Host "Waiting for backend to start..."
            $maxRetries = 20
            $success = $false
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/healthz" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "Backend health check passed!"
                  $success = $true
                  break
                }
              } catch {
                Write-Host "Health check attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            }
            
            if (-not $success) {
              throw "Backend did not become healthy after $maxRetries attempts"
            }
            
            Write-Host "Testing data ingestion endpoint..."
            $body = @{
              query_name = "example.com"
              query_type = "A"
              query_status = "NOERROR"
              timestamp = (Get-Date).ToUniversalTime().ToString("o")
              process_name = "gha-test"
              process_id = 1234
            } | ConvertTo-Json
            
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/ingest/event" -Method POST -Body $body -ContentType "application/json" -UseBasicParsing
            Write-Host "Data ingestion test passed!"
            Write-Host "Response: $($response.Content)"
            
          } finally {
            if ($backend -and -not $backend.HasExited) {
              Write-Host "Stopping backend server..."
              Stop-Process -Id $backend.Id -Force
            }
          }
        shell: pwsh

      - name: Frontend - start server and smoke test
        run: |
          $frontend = Start-Process pwsh `
            -WorkingDirectory "$PWD\frontend" `
            -ArgumentList '-NoLogo','-NoProfile','-Command','npm run preview -- --host 127.0.0.1 --port 4173' `
            -PassThru -WindowStyle Hidden
          
          try {
            Write-Host "Waiting for frontend to start..."
            $maxRetries = 20
            $success = $false
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "Frontend server test passed!"
                  $success = $true
                  break
                }
              } catch {
                Write-Host "Frontend test attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            }
            
            if (-not $success) {
              throw "Frontend did not become reachable after $maxRetries attempts"
            }
            
          } finally {
            if ($frontend -and -not $frontend.HasExited) {
              Write-Host "Stopping frontend server..."
              Stop-Process -Id $frontend.Id -Force
            }
          }
        shell: pwsh

      - name: Deployment Summary
        run: |
          Write-Host "========================================="
          Write-Host "DNS Secure Application Deployment Summary"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "✓ Backend API deployed and running on port 8000"
          Write-Host "✓ Data ingestion endpoint tested successfully"
          Write-Host "✓ Frontend built and deployed on port 4173"
          Write-Host ""
          Write-Host "All components deployed successfully!"
        shell: pwsh

  deploy-self-hosted:
    runs-on: [self-hosted, windows]
    continue-on-error: true
    # Note: Runner service must run as LOCAL SYSTEM for Python installation to work
    defaults:
      run:
        shell: powershell
    
    steps:
      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          path: orchestrator

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: RegevNir/dns-secure-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: RegevNir/dns-secure-frontend
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python 3.12 (system-wide)
        run: |
          $pythonVersion = "3.12.10"
          $pythonInstaller = "python-$pythonVersion-amd64.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP $pythonInstaller
          
          # Try to find existing Python installation
          $pythonHome = $null
          $possiblePaths = @(
            "C:\Program Files\Python312",
            "C:\Program Files (x86)\Python312"
          )
          
          foreach ($path in $possiblePaths) {
            if (Test-Path "$path\python.exe") {
              $pythonHome = $path
              Write-Host "Found existing Python 3.12 at $pythonHome"
              break
            }
          }
          
          if (-not $pythonHome) {
            Write-Host "Downloading Python $pythonVersion installer..."
            # Force TLS 1.2 for older Windows PowerShell
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pythonVersion/$pythonInstaller" -OutFile $installerPath -UseBasicParsing
            
            Write-Host "Installing Python $pythonVersion (system-wide)..."
            # Run installer directly (not via Start-Process) to ensure proper completion
            & $installerPath /quiet InstallAllUsers=1 Include_pip=1 PrependPath=0
            $exitCode = $LASTEXITCODE
            Write-Host "Installer exit code: $exitCode"
            
            # Poll for installation completion (up to 2 minutes)
            Write-Host "Waiting for Python installation to complete..."
            $maxWaitSeconds = 120
            $waitedSeconds = 0
            $found = $false
            
            while ($waitedSeconds -lt $maxWaitSeconds) {
              Start-Sleep -Seconds 5
              $waitedSeconds += 5
              
              # Check standard installation paths
              foreach ($path in $possiblePaths) {
                if (Test-Path "$path\python.exe") {
                  $pythonHome = $path
                  $found = $true
                  Write-Host "Python installation detected at $pythonHome after $waitedSeconds seconds"
                  break
                }
              }
              
              if ($found) { break }
              
              # Try registry lookup
              try {
                $regPath = "HKLM:\SOFTWARE\Python\PythonCore\3.12\InstallPath"
                if (Test-Path $regPath) {
                  $pythonHome = (Get-ItemProperty $regPath).'(default)'
                  if ($pythonHome -and (Test-Path "$pythonHome\python.exe")) {
                    $found = $true
                    Write-Host "Python installation found via registry at $pythonHome"
                    break
                  }
                }
              } catch {
                # Registry lookup failed, continue polling
              }
              
              Write-Host "Still waiting... ($waitedSeconds/$maxWaitSeconds seconds)"
            }
            
            if (-not $found) {
              Write-Error "Python installation failed - python.exe not found after $maxWaitSeconds seconds"
              Write-Host "Checked paths: $($possiblePaths -join ', ')"
              Write-Host "Trying where.exe python..."
              where.exe python
              exit 1
            }
            
            Write-Host "Python installation complete at $pythonHome"
          }
          
          # Add Python to PATH for this job
          echo "$pythonHome" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$pythonHome\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Verify installation
          Write-Host "Verifying Python installation..."
          & "$pythonHome\python.exe" --version
          
          # Bootstrap pip if needed
          Write-Host "Checking pip installation..."
          try {
            & "$pythonHome\python.exe" -m pip --version
            Write-Host "pip is already available"
          } catch {
            Write-Host "pip not found, bootstrapping with ensurepip..."
            & "$pythonHome\python.exe" -m ensurepip --upgrade
            Write-Host "Upgrading pip, setuptools, and wheel..."
            & "$pythonHome\python.exe" -m pip install --upgrade pip setuptools wheel
          }
          
          # Verify pip is working
          & "$pythonHome\python.exe" -m pip --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pypoetry\Cache
            backend\.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend\node_modules
            ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Poetry
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:APPDATA\Python\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Poetry
        working-directory: backend
        run: poetry config virtualenvs.in-project true

      - name: Verify Poetry installation
        run: poetry --version

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if (Test-Path ".venv") {
            Write-Host "Virtual environment found, checking if dependencies are up to date..."
            poetry install --no-interaction --no-ansi
          } else {
            Write-Host "No virtual environment found, installing dependencies from scratch..."
            poetry install --no-interaction --no-ansi
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Backend - start server and run API checks
        run: |
          $backend = Start-Process powershell `
            -WorkingDirectory "$PWD\backend" `
            -ArgumentList '-NoLogo','-NoProfile','-Command','poetry run python -m uvicorn app.main:app --host 127.0.0.1 --port 8000' `
            -PassThru -WindowStyle Hidden
          
          try {
            Write-Host "Waiting for backend to start..."
            $maxRetries = 20
            $success = $false
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/healthz" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "Backend health check passed!"
                  $success = $true
                  break
                }
              } catch {
                Write-Host "Health check attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            }
            
            if (-not $success) {
              throw "Backend did not become healthy after $maxRetries attempts"
            }
            
            Write-Host "Testing data ingestion endpoint..."
            $body = @{
              query_name = "example.com"
              query_type = "A"
              query_status = "NOERROR"
              timestamp = (Get-Date).ToUniversalTime().ToString("o")
              process_name = "gha-test"
              process_id = 1234
            } | ConvertTo-Json
            
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/ingest/event" -Method POST -Body $body -ContentType "application/json" -UseBasicParsing
            Write-Host "Data ingestion test passed!"
            Write-Host "Response: $($response.Content)"
            
          } finally {
            if ($backend -and -not $backend.HasExited) {
              Write-Host "Stopping backend server..."
              Stop-Process -Id $backend.Id -Force
            }
          }

      - name: Frontend - start server and smoke test
        run: |
          $frontend = Start-Process powershell `
            -WorkingDirectory "$PWD\frontend" `
            -ArgumentList '-NoLogo','-NoProfile','-Command','npm run preview -- --host 127.0.0.1 --port 4173' `
            -PassThru -WindowStyle Hidden
          
          try {
            Write-Host "Waiting for frontend to start..."
            $maxRetries = 20
            $success = $false
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "Frontend server test passed!"
                  $success = $true
                  break
                }
              } catch {
                Write-Host "Frontend test attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            }
            
            if (-not $success) {
              throw "Frontend did not become reachable after $maxRetries attempts"
            }
            
          } finally {
            if ($frontend -and -not $frontend.HasExited) {
              Write-Host "Stopping frontend server..."
              Stop-Process -Id $frontend.Id -Force
            }
          }

      - name: Deployment Summary
        run: |
          Write-Host "========================================="
          Write-Host "DNS Secure Application Deployment Summary (Self-Hosted)"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "✓ Backend API deployed and running on port 8000"
          Write-Host "✓ Data ingestion endpoint tested successfully"
          Write-Host "✓ Frontend built and deployed on port 4173"
          Write-Host ""
          Write-Host "All components deployed successfully on self-hosted runner!"
