name: Deploy DNS Secure Application

on:
  workflow_dispatch:
  pull_request:
    branches:
      - initial-setup
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest
    
    steps:
      - name: Checkout orchestrator repository
        uses: actions/checkout@v4
        with:
          path: orchestrator

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: RegevNir/dns-secure-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: RegevNir/dns-secure-frontend
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pypoetry\Cache
            backend\.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend\node_modules
            ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Poetry
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:APPDATA\Python\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Configure Poetry
        working-directory: backend
        run: poetry config virtualenvs.in-project true
        shell: pwsh

      - name: Verify Poetry installation
        run: poetry --version
        shell: pwsh

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if (Test-Path ".venv") {
            Write-Host "Virtual environment found, checking if dependencies are up to date..."
            poetry install --no-interaction --no-ansi
          } else {
            Write-Host "No virtual environment found, installing dependencies from scratch..."
            poetry install --no-interaction --no-ansi
          }
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        shell: pwsh

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        shell: pwsh

      - name: Backend - start server and run API checks
        run: |
          $backend = Start-Process pwsh `
            -WorkingDirectory "$PWD\backend" `
            -ArgumentList '-NoLogo','-NoProfile','-Command','poetry run python -m uvicorn app.main:app --host 127.0.0.1 --port 8000' `
            -PassThru -WindowStyle Hidden
          
          try {
            Write-Host "Waiting for backend to start..."
            $maxRetries = 20
            $success = $false
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/healthz" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "Backend health check passed!"
                  $success = $true
                  break
                }
              } catch {
                Write-Host "Health check attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            }
            
            if (-not $success) {
              throw "Backend did not become healthy after $maxRetries attempts"
            }
            
            Write-Host "Testing data ingestion endpoint..."
            $body = @{
              query_name = "example.com"
              query_type = "A"
              query_status = "NOERROR"
              timestamp = (Get-Date).ToUniversalTime().ToString("o")
              process_name = "gha-test"
              process_id = 1234
            } | ConvertTo-Json
            
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/ingest/event" -Method POST -Body $body -ContentType "application/json" -UseBasicParsing
            Write-Host "Data ingestion test passed!"
            Write-Host "Response: $($response.Content)"
            
          } finally {
            if ($backend -and -not $backend.HasExited) {
              Write-Host "Stopping backend server..."
              Stop-Process -Id $backend.Id -Force
            }
          }
        shell: pwsh

      - name: Frontend - start server and smoke test
        run: |
          $frontend = Start-Process pwsh `
            -WorkingDirectory "$PWD\frontend" `
            -ArgumentList '-NoLogo','-NoProfile','-Command','npm run preview -- --host 127.0.0.1 --port 4173' `
            -PassThru -WindowStyle Hidden
          
          try {
            Write-Host "Waiting for frontend to start..."
            $maxRetries = 20
            $success = $false
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173" -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "Frontend server test passed!"
                  $success = $true
                  break
                }
              } catch {
                Write-Host "Frontend test attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            }
            
            if (-not $success) {
              throw "Frontend did not become reachable after $maxRetries attempts"
            }
            
          } finally {
            if ($frontend -and -not $frontend.HasExited) {
              Write-Host "Stopping frontend server..."
              Stop-Process -Id $frontend.Id -Force
            }
          }
        shell: pwsh

      - name: Deployment Summary
        run: |
          Write-Host "========================================="
          Write-Host "DNS Secure Application Deployment Summary"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "✓ Backend API deployed and running on port 8000"
          Write-Host "✓ Data ingestion endpoint tested successfully"
          Write-Host "✓ Frontend built and deployed on port 4173"
          Write-Host ""
          Write-Host "All components deployed successfully!"
        shell: pwsh
